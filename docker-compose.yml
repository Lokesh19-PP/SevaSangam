# =========================================================
# SevaSangam — Docker Compose
# "Trusted Services. Fair Opportunities. Stronger Communities."
# =========================================================

version: "3.9"

services:
  # ---------------------------------------------------------
  # Frontend — React + Vite
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

  # ---------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://sevasangam:sevasangam@db:5432/sevasangam
      - ENVIRONMENT=development
      - DEBUG=True
      - API_V1_STR=/api
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------
  # Database — PostgreSQL + PostGIS
  # ---------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sevasangam
      - POSTGRES_PASSWORD=sevasangam
      - POSTGRES_DB=sevasangam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasangam -d sevasangam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
